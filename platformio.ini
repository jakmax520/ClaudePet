; FoloToy AI Passport (ESP32-C3) —— claude-desktop-buddy 的硬件层移植
;
; 移植原则：渲染层与宠物资源保持与 claude-desktop-buddy 原版一致。
; 本项目只替换 M5StickC Plus 专属的硬件抽象（M5.Lcd / M5.Axp / M5.BtnA/B /
; M5.Imu / M5.Beep / M5.Rtc），改为面向本板的 HAL。
;
; 硬件参数来源：FoloToy/ai-passport 的 components/bsp/include/bsp_pins.h
; （仅作为硬件事实参考，未沿用其 ESP-IDF 代码结构）

[env:folotoy-ai-passport]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

    ; 让 src/hal/M5StickCPlus.h 顶替真库：
    ; 上层 4 个文件都写 #include <M5StickCPlus.h>，靠这条路径解析到我们的垫片，
    ; 因此它们的包含语句一个字都不用改。
    -Isrc/hal

    ; 修正 TFT_eSPI 在 ESP32-C3 上的 SPI 寄存器基址缺陷。必须对所有编译单元
    ; 生效（包括 TFT_eSPI 自身的编译单元，_spi_user 是在那里初始化的），
    ; 所以用 -include 而非在某个头文件里修。详见该文件内的成因说明。
    -include src/hal/tft_c3_spi_fix.h

    ; --- 控制台走 USB-Serial-JTAG(GPIO18/19) ---
    ; 不能用 UART0:其默认 TX=GPIO21、RX=GPIO20,正好与本板背光、LCD DC 引脚冲突。
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- TFT_eSPI 配置 ---
    ; 跳过 User_Setup.h,全部在此定义。对应 bsp_pins.h 的显示段。
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=9
    -DTFT_SCLK=8
    -DTFT_CS=1
    -DTFT_DC=20
    ; -1 = 复位脚未接 MCU,由驱动走 SWRESET 软复位(同 bsp_pins.h 的 BSP_LCD_RST)
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; ST7789P3 出厂需反色,对应 BSP_LCD_INVERT_COLOR=1。
    ; 若换屏后画面呈负片,把下行改成 -DTFT_INVERSION_OFF=1。
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    ; 不开 SMOOTH_FONT：本项目只用 setTextSize 的位图字体，不需要抗锯齿字体。
    ; 而且 TFT_eSPI 一旦启用 SMOOTH_FONT 就会 #define FS_NO_GLOBALS 再 #include <FS.h>，
    ; 导致 FS.h 不再把 fs::File 提到全局命名空间，上层大量使用 File 的代码会编译失败。

; +<*> 不含子目录，buddies/ 与原版的 hal/ 都要显式列出。
build_src_filter = +<*> +<buddies/> +<hal/>

; CW2017 电量计不引第三方库：寄存器读写很简单，已由 src/hal/hal.cpp 直接用 Wire 实现，
; 与 bsp_battery.c 的取值方式一致（VCELL 低 14 位，V = raw * 312.5uV）。
; BLE 栈用 NimBLE-Arduino 而非 Arduino 内核自带的 Bluedroid：
; ESP32-C3 无 PSRAM，Bluedroid 在满屏 16 位精灵图（153.6KB）之后会把空闲堆压到
; 约 2.9KB，不足以容纳协议行与 JSON 解析（实测）。NimBLE 官方称省约 100KB RAM。
lib_deps =
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^2.5.1
